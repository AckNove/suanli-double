[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "compute-dual"
version = "0.1.0"
description = "算力双项目 MVP：证据管理 / 研究 ticket 工作流 / 供需硬过滤匹配 / 敏感数据隔离"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "trafilatura>=1.9",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
ak = "compute_dual.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
